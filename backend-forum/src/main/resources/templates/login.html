<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>論壇登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>
<div class="login-container">
    <div class="login-wrapper">

        <div class="brand-section">
            <div class="brand-logo">
                <i class="bi bi-cpu"></i>
            </div>
            <h1>XX論壇</h1>
            <p>論壇登入頁面</p>

            <div class="feature-list">
                <div><i class="bi bi-shield-check"></i>最佳討論平台</div>
                <div><i class="bi bi-database-check"></i>最棒使用者體驗</div>
                <div><i class="bi bi-code-square"></i>無限制上傳內容</div>
            </div>
        </div>

        <div class="login-card">
            <h2>歡迎回來</h2>
            <p class="subtitle">請登入您的帳號</p>

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>
            
			<form id="loginForm" th:action="@{/login}" method="post">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="account" name="account" placeholder="請輸入帳號">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼">
                </div>

                <div class="remember-row">
                    <div>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">記住我</label>
                    </div>
                    <a href="#">忘記密碼？</a>
                </div>
                <div class="text-danger small mt-1" id="loginError" th:text="${error}"></div>

                <button type="submit" class="btn btn-primary login-btn">
                    登入
                </button>

            </form>

            <div class="register-link">
                還沒有帳號？
                <a th:href="@{/register}">立即註冊</a>
            </div>
        </div>

    </div>
</div>

<script>
	let loginForm=document.getElementById("loginForm");
	
	loginForm.addEventListener("submit",function(e){
	
	    let account=document.getElementById("account").value.trim();
	    let password=document.getElementById("password").value.trim();
	
    	let loginError=document.getElementById("loginError");
    	
    	loginError.innerHTML="";
	
	    let valid=true;
	
	    if(account===""){
        	loginError.innerHTML="請輸入帳號";
	        e.preventDefault();
	        return;
	    }
	
	    if(password===""){
        	loginError.innerHTML="請輸入密碼";
	        e.preventDefault();
	        return;
	    }
	
	});
	
	document.getElementById("account").addEventListener("input",function(){
	    document.getElementById("accountError").innerHTML="";
	});
	
	document.getElementById("password").addEventListener("input",function(){
	    document.getElementById("passwordError").innerHTML="";
	});
</script>
</body>
</html>
